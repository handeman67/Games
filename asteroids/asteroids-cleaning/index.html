    <title>Asteroids Game</title>
    <link rel="stylesheet" href="css/main.css">

    <script language="javascript">
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>


</head>

<body>

    <div class="container grid" id="wrapper" name="wrap"></div>
    <div class="header" id="topheader" name="top"></div>

    <script language="javascript" src="js/ships.js"></script>
    <script language="javascript" src="js/laser.js"></script>
