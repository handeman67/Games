<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="Centipede Game - A classic arcade-style game with enhanced graphics and gameplay">
  <meta name="theme-color" content="#000">
  <title>Centipede Game</title>
  
  <!-- Performance optimization - preload critical resources -->
  <link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js">
  <link rel="preload" as="style" href="src/css/style.css">
  
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div class="wrap">
    <div id='head' class="head">
      <div class="game-stats">
        <div class="stat-item">
          <span class="stat-label">SCORE:</span>
          <span id="score" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">LEVEL:</span>
          <span id="level" class="stat-value">1</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">LIVES:</span>
          <span id="lives" class="stat-value">3</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">HIGH SCORE:</span>
          <span id="highscore" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">FPS:</span>
          <span id="fps" class="stat-value">60</span>
        </div>
      </div>
    </div>
    <div id="canv"></div>
  </div>

  <!-- p5.js library - minified for faster loading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.dom.min.js" defer></script>
  
  <!-- Game system files - must load in order -->
  <script src="Particles.js" defer></script>
  <script src="MushroomBitmap.optimized.js" defer></script>

  <!-- Game classes -->
  <script src="Tile.js" defer></script>
  <script src="Dot.js" defer></script>
  <script src="words.js" defer></script>
  <script src="Player.js" defer></script>
  <script src="Laser.js" defer></script>
  <script src="Mush.js" defer></script>

  <!-- Main game setup - must load last -->
  <script src="stup.optimized.js" defer></script>
</body>
</html>
