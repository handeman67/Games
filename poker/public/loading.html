<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Server Loading</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --border: #30363d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 20% 20%, #1f2937 0%, var(--bg) 55%);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .wrap {
            width: min(860px, 92vw);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,.45);
            overflow: hidden;
        }

        .video-placeholder {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #111827, #1f2937);
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 1.1rem;
            letter-spacing: .2px;
        }

        .play-icon {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: rgba(88,166,255,.2);
            border: 2px solid rgba(88,166,255,.45);
            display: grid;
            place-items: center;
            margin-bottom: 12px;
        }

        .play-icon::before {
            content: '';
            margin-left: 5px;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 18px solid var(--accent);
        }

        .body {
            padding: 18px 20px 22px;
        }

        .title {
            margin: 0 0 8px;
            font-size: 1.25rem;
        }

        .status {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: .96rem;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(88,166,255,.25);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .ok { color: #3fb950; }
        .err { color: #f85149; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="video-placeholder">
            <div style="text-align:center">
                <div class="play-icon"></div>
                <div>Video Placeholder</div>
            </div>
        </div>
        <div class="body">
            <h1 class="title">Starting Poker Server...</h1>
            <p id="status" class="status">Waiting for backend readiness check.</p>
            <div class="row">
                <div class="spinner" id="spinner"></div>
                <small>Preparing table services in background</small>
            </div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const spinner = document.getElementById('spinner');

        async function checkReady() {
            try {
                const res = await fetch('/ready', { cache: 'no-store' });
                if (!res.ok) throw new Error('not ready');
                const data = await res.json();
                if (data && data.ok) {
                    statusEl.textContent = 'Server is ready. Redirecting to table...';
                    statusEl.classList.add('ok');
                    setTimeout(() => { window.location.href = '/'; }, 500);
                    return;
                }
                throw new Error('not ready');
            } catch (err) {
                statusEl.textContent = 'Server not ready yet. Retrying...';
                statusEl.classList.remove('ok');
                statusEl.classList.add('err');
                setTimeout(() => {
                    statusEl.classList.remove('err');
                    checkReady();
                }, 1000);
            }
        }

        checkReady();
    </script>
</body>
</html>
