<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Server Loading</title>
    <style>
        :root {
            --bg: #05070d;
            --text: #f2f5ff;
            --muted: #b8c0d9;
            --accent: #6ea8ff;
            --panel: rgba(9, 14, 28, 0.78);
            --border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #04060d;
            color: var(--text);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .stage {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
        }

        .gif-layer {
            position: absolute;
            inset: 0;
            width: 75%;
            height: 75%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 550ms ease;
            filter: saturate(1.15) contrast(1.05);
        }

        .gif-layer.active {
            opacity: 1;
        }

        .overlay {
            position: relative;
            z-index: 2;
            width: min(760px, 92vw);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            backdrop-filter: blur(4px);
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.25rem;
            letter-spacing: 0.2px;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.45;
            font-size: 0.95rem;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .spinner {
            width: 17px;
            height: 17px;
            border-radius: 50%;
            border: 2px solid rgba(110, 168, 255, 0.35);
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
        }

        .ok { color: #5de6a3; }
        .err { color: #ff7f8a; }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="stage">
        <img id="gif-a" class="gif-layer active" src="./QQxf.gif" alt="Loading animation part 1">
        <img id="gif-b" class="gif-layer" src="./ALVv.gif" alt="Loading animation part 2">

        <div class="overlay">
            <h1>Starting Poker Table...</h1>
            <p id="status">Initializing server and preparing game services.</p>
            <div class="row">
                <div class="spinner" id="spinner"></div>
                <small id="step">Loading intro sequence...</small>
            </div>
        </div>
    </div>

    <script>
        const gifA = document.getElementById('gif-a');
        const gifB = document.getElementById('gif-b');
        const statusEl = document.getElementById('status');
        const stepEl = document.getElementById('step');

        let introDone = false;
        let switched = false;

        // Play two GIFs sequentially by switching visibility after a short hold.
        setTimeout(() => {
            switched = true;
            gifA.classList.remove('active');
            gifB.classList.add('active');
            stepEl.textContent = 'Finalizing startup...';
        }, 2200);

        setTimeout(() => {
            introDone = true;
            maybeRedirectWhenReady();
        }, 4400);

        async function checkReady() {
            const res = await fetch('/ready', { cache: 'no-store' });
            if (!res.ok) throw new Error('not ready');
            const data = await res.json();
            return !!(data && data.ok);
        }

        let ready = false;

        async function pollReady() {
            try {
                ready = await checkReady();
                if (ready) {
                    statusEl.textContent = 'Server ready. Waiting for intro to complete...';
                    statusEl.classList.remove('err');
                    statusEl.classList.add('ok');
                    maybeRedirectWhenReady();
                    return;
                }
                throw new Error('not ready');
            } catch {
                statusEl.textContent = switched
                    ? 'Server still warming up. Retrying...'
                    : 'Checking backend readiness...';
                statusEl.classList.remove('ok');
                statusEl.classList.add('err');
                setTimeout(() => {
                    statusEl.classList.remove('err');
                    pollReady();
                }, 1000);
            }
        }

        function maybeRedirectWhenReady() {
            if (ready && introDone) {
                statusEl.textContent = 'Server ready. Entering table...';
                statusEl.classList.add('ok');
                setTimeout(() => { window.location.href = '/'; }, 500);
            }
        }

        pollReady();
    </script>
</body>
</html>
