<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carpentry Quiz</title>
  <link rel="stylesheet" href="mui-lite.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <span aria-hidden="true" style="font-size: 22px;">&#10003;</span>
      <h1>Carpentry Quiz</h1>
      <span class="score-chip" id="scoreChip">Score: 0</span>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="picker">
        <div class="select-wrap">
          <label for="testSelect">Choose a test</label>
          <select id="testSelect"></select>
        </div>
        <button class="btn btn-outlined" id="nextTestBtn" type="button">Next test</button>
      </div>
      <p class="muted" id="testInfo"></p>
    </section>

    <p id="loading">Loading quiz…</p>
    <div class="alert error" id="errorBox" hidden></div>

    <div id="quizArea">
      <div class="progress-row">
        <span id="progressText"></span>
        <span id="progressScore"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

      <nav class="nav" id="navButtons" aria-label="Questions"></nav>

      <section class="card">
        <span class="chip" id="questionChip"></span>
        <span class="chip outlined" id="categoryChip" hidden></span>
        <h2 id="questionText"></h2>
        <ul class="answers" id="answersList"></ul>
        <div class="alert" id="feedback" hidden></div>
      </section>

      <div class="qnav">
        <button class="btn btn-outlined" id="prevBtn" type="button">Previous</button>
        <button class="btn btn-contained" id="nextQBtn" type="button">Next question</button>
      </div>

      <section class="card complete" id="completeCard" hidden>
        <h2>Test complete</h2>
        <p id="completeText"></p>
        <button class="btn btn-contained" id="tryNextBtn" type="button">Try the next test</button>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
