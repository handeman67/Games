<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpentry Quiz</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <template id="card">
        <div id="wrap">
            <div id="header">
                <h1 id="title">
                    Carpentry Quiz
                </h1>
                <label for="setSelect">Choose a test:</label>
                <select id="setSelect"></select>
                <button id="nextBtn" type="button">Next test</button>
                <h5>Score:</h5>
                <div id="score" data-scr="0"></div>
                <p id="setName"></p>
                <p id="progress"></p>
            </div>
            <div id="main">
                <fieldset>
                    <legend id="que">Questions:</legend>
                    <p id="questions"></p>
                </fieldset>
                <fieldset>
                    <legend id="ans">Answers:</legend>
                    <div id="answers">
                        <input type="radio" name="answer" id="answer0">
                        <label id="label0" for="answer0">A</label>
                        <input type="radio" name="answer" id="answer1">
                        <label id="label1" for="answer1">B</label>
                        <input type="radio" name="answer" id="answer2">
                        <label id="label2" for="answer2">C</label>
                        <input type="radio" name="answer" id="answer3">
                        <label id="label3" for="answer3">D</label>
                        <input type="radio" name="answer" id="answer4">
                        <label id="label4" for="answer4">E</label>
                    </div>
                </fieldset>
            </div>
        </div>
    </template>

    <script src="./index.js"></script>
</body>

</html>
